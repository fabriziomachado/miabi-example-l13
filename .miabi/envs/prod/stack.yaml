# Production desired state for the workspace `production` (id 2).
# Apply this file only there. A GitSource in the system workspace would
# collide with the backup app that still serves laravel-example.
#
# Secrets are vault names, not values. Create laravel-app-key in the vault
# before the first sync (php artisan key:generate --show). Do not generate it
# here: length 32 is not a Laravel key, and do not reuse the system or develop
# key. minio-root-password is generated on first apply.
#
# Dev already proved Docker Hub will not serve minio/minio here: before the
# first sync, copy registry.miabi.unesc.net/system/minio:release-2025-09-07
# into registry.miabi.unesc.net/production/minio:release-2025-09-07.
# Create the bucket `laravel` after MinIO is up.
apiVersion: miabi.io/v1
kind: Database
metadata: { name: laravel-db }
spec:
  engine: postgres
  version: "16-alpine"
  instance: dedicated
---
apiVersion: miabi.io/v1
kind: Volume
metadata: { name: minio-data }
spec:
  size: 20Gi
---
apiVersion: miabi.io/v1
kind: Secret
metadata: { name: minio-root-password }
spec:
  generate: true
  length: 32
---
apiVersion: miabi.io/v1
kind: Application
metadata: { name: minio }
spec:
  image: registry.miabi.unesc.net/production/minio:release-2025-09-07
  command: ["server", "/data", "--console-address", ":9001"]
  ports:
    - container: 9000
      scheme: http
    - container: 9001
      scheme: http
  mounts:
    - volume: minio-data
      path: /data
  deployment:
    runtime: service
    replicas: 1
  env:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: "{{ .secrets.minio-root-password }}"
  secretEnv:
    - MINIO_ROOT_PASSWORD
  healthcheck:
    type: http
    path: /minio/health/live
    port: 9000
    intervalSeconds: 30
    timeoutSeconds: 5
    retries: 3
    startPeriodSeconds: 15
---
apiVersion: miabi.io/v1
kind: Application
metadata: { name: miabil13 }
spec:
  # Build from Git. The pipeline on main deploys the image; this block does not pin it.
  source:
    git: https://github.com/fabriziomachado/miabi-example-l13.git
    ref: main
    buildMethod: dockerfile
  ports:
    - container: 8080
      scheme: http
  deployment:
    runtime: service
    replicas: 2
    strategy: rolling
    update:
      parallelism: 1
      delaySeconds: 15
  placement:
    constraints: []
  healthcheck:
    type: http
    path: /up
    port: 8080
    intervalSeconds: 30
    timeoutSeconds: 5
    retries: 3
    startPeriodSeconds: 90
  env:
    APP_NAME: Laravel
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: "{{ .secrets.laravel-app-key }}"
    APP_URL: "https://miabil13.miabi.unesc.net"
    ASSET_URL: "https://miabil13.miabi.unesc.net"

    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    PHP_OPCACHE_ENABLE: "1"

    DB_CONNECTION: pgsql
    DB_HOST: "{{ .databases.laravel-db.host }}"
    DB_PORT: "{{ .databases.laravel-db.port }}"
    DB_DATABASE: "{{ .databases.laravel-db.name }}"
    DB_USERNAME: "{{ .databases.laravel-db.user }}"
    DB_PASSWORD: "{{ .databases.laravel-db.password }}"
    DB_SSLMODE: disable

    # Both replicas share the MinIO declared above.
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: "{{ .secrets.minio-root-password }}"
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: laravel
    AWS_ENDPOINT: "http://{{ .applications.minio.host }}:9000"
    AWS_URL: "http://{{ .applications.minio.host }}:9000"
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

    SSL_MODE: "off"
    HEALTHCHECK_PATH: /up
    CADDY_SERVER_ROOT: /var/www/html/public

    AUTORUN_ENABLED: "true"
    AUTORUN_LARAVEL_STORAGE_LINK: "true"
    AUTORUN_LARAVEL_MIGRATION: "true"
    AUTORUN_LARAVEL_MIGRATION_FORCE: "true"
    # false on purpose: --isolated takes a database cache lock, and cache_locks
    # does not exist until this migration creates it. A fresh database would
    # crash-loop. Postgres still serializes the schema changes.
    AUTORUN_LARAVEL_MIGRATION_ISOLATION: "false"
    AUTORUN_LARAVEL_OPTIMIZE: "true"

    # Docker Swarm expands this per task to the node hostname.
    # Double-escaped: Miabi renders env twice (GitOps file + apply). After
    # both passes the value must still be the Swarm literal {{.Node.Hostname}}.
    # Listed in secretEnv so self-heal does not treat the live hostname as
    # drift against the template.
    NODE_HOSTNAME: '{{`{{ "{{.Node.Hostname}}" }}`}}'
  secretEnv:
    - APP_KEY
    - DB_PASSWORD
    - AWS_SECRET_ACCESS_KEY
    - NODE_HOSTNAME
  resources:
    memory: 1Gi
    cpu: "1"
---
# The zone miabi.unesc.net is already verified on the platform. It is not
# declared here so GitOps does not take ownership of that domain.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: miabil13 }
spec:
  hosts: [miabil13.miabi.unesc.net]
  app: miabil13
  port: 8080
  path: /
  tls: acme
