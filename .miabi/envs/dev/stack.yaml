# Dev desired state for the develop workspace.
#
# Point a GitSource at this folder (.miabi/envs/dev), ref develop. Automatic,
# prune and self-heal are the intended policy: Git is the desired state.
# The pipeline on the develop branch builds miabil13 and `uses: deploy` rolls
# the digest out. Do not write that tag or digest here.
#
# Secrets are names in the vault, not values. Create laravel-app-key once in
# Sources → Secrets (php artisan key:generate --show, base64:…). Do not set
# generate: true on it: a random 32-character string is not a Laravel key.
# minio-root-password is generated on first apply. The zone miabi.unesc.net
# is already verified; it is not declared here.
apiVersion: miabi.io/v1
kind: Database
metadata: { name: laravel-db }
spec:
  engine: postgres
  version: "16-alpine"
  # Reuse the Postgres already running in the workspace when one is compatible.
  instance: auto
---
apiVersion: miabi.io/v1
kind: Volume
metadata: { name: minio-data }
spec:
  size: 20Gi
---
apiVersion: miabi.io/v1
kind: Secret
metadata: { name: minio-root-password }
spec:
  generate: true
  length: 32
---
apiVersion: miabi.io/v1
kind: Application
metadata: { name: minio }
spec:
  # Copied once from the system registry. Docker Hub does not serve this image.
  image: registry.miabi.unesc.net/develop/minio:release-2025-09-07
  command: ["server", "/data", "--console-address", ":9001"]
  ports:
    - container: 9000
      scheme: http
    - container: 9001
      scheme: http
  mounts:
    - volume: minio-data
      path: /data
  deployment:
    runtime: service
    replicas: 1
  env:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: "{{ .secrets.minio-root-password }}"
  secretEnv:
    - MINIO_ROOT_PASSWORD
  healthcheck:
    type: http
    path: /minio/health/live
    port: 9000
    intervalSeconds: 30
    timeoutSeconds: 5
    retries: 3
    startPeriodSeconds: 15
---
apiVersion: miabi.io/v1
kind: Application
metadata: { name: miabil13 }
spec:
  # Build from Git. The pipeline deploys the image; this block does not pin it.
  source:
    git: https://github.com/fabriziomachado/miabi-example-l13.git
    ref: develop
    buildMethod: dockerfile
  ports:
    - container: 8080
      scheme: http
  deployment:
    # Two Swarm tasks, free to land on either node. Postgres and MinIO are
    # reached by name on the overlay network. There is no volume on this app,
    # so the scheduler can place one task on each node. An empty constraint
    # list is what allows that; pinning a hostname would put both tasks on
    # the same node.
    runtime: service
    replicas: 2
    strategy: rolling
    update:
      parallelism: 1
      delaySeconds: 10
  placement:
    constraints: []
  # Probe Laravel itself (/up), not only the web server. Start period covers
  # AUTORUN migrate + optimize before the first check must pass.
  healthcheck:
    type: http
    path: /up
    port: 8080
    intervalSeconds: 30
    timeoutSeconds: 5
    retries: 3
    startPeriodSeconds: 90
  env:
    APP_NAME: Laravel
    APP_ENV: development
    APP_DEBUG: "false"
    APP_KEY: "{{ .secrets.laravel-app-key }}"
    APP_URL: "https://miabil13-dev.miabi.unesc.net"
    ASSET_URL: "https://miabil13-dev.miabi.unesc.net"

    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    PHP_OPCACHE_ENABLE: "1"

    DB_CONNECTION: pgsql
    DB_HOST: "{{ .databases.laravel-db.host }}"
    DB_PORT: "{{ .databases.laravel-db.port }}"
    DB_DATABASE: "{{ .databases.laravel-db.name }}"
    DB_USERNAME: "{{ .databases.laravel-db.user }}"
    DB_PASSWORD: "{{ .databases.laravel-db.password }}"
    DB_SSLMODE: disable

    # Default disk is s3 so both replicas see the same files. The bucket
    # `laravel` lives on the MinIO declared above. The password is the vault
    # secret minio-root-password — the same value that app uses as root.
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: "{{ .secrets.minio-root-password }}"
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: laravel
    AWS_ENDPOINT: "http://{{ .applications.minio.host }}:9000"
    AWS_URL: "http://{{ .applications.minio.host }}:9000"
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

    # serversideup/php FrankenPHP — TLS ends at Miabi, not inside the container.
    SSL_MODE: "off"
    HEALTHCHECK_PATH: /up
    CADDY_SERVER_ROOT: /var/www/html/public

    AUTORUN_ENABLED: "true"
    AUTORUN_LARAVEL_STORAGE_LINK: "true"
    AUTORUN_LARAVEL_MIGRATION: "true"
    AUTORUN_LARAVEL_MIGRATION_FORCE: "true"
    AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    AUTORUN_LARAVEL_OPTIMIZE: "true"

    # Docker Swarm expands this per task to the node hostname.
    # Double-escaped: Miabi renders env twice (GitOps file + apply). After
    # both passes the value must still be the Swarm literal {{.Node.Hostname}}.
    # Listed in secretEnv so self-heal does not treat the live hostname as
    # drift against the template.
    NODE_HOSTNAME: '{{`{{ "{{.Node.Hostname}}" }}`}}'
  secretEnv:
    - APP_KEY
    - DB_PASSWORD
    - AWS_SECRET_ACCESS_KEY
    - NODE_HOSTNAME
  resources:
    memory: 512Mi
    cpu: "0.5"
---
# The zone miabi.unesc.net is already registered and verified in the panel
# (wildcard, TLS automatic). It is not declared here so GitOps does not take
# ownership of that domain.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: miabil13 }
spec:
  hosts: [miabil13-dev.miabi.unesc.net]
  app: miabil13
  port: 8080
  path: /
  tls: acme
