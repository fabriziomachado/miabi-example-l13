# Pipeline-as-code for this Laravel 13 + React (Inertia) app.
# Miabi adopts this file when the application is created from Git.
#
# This deploys the dev app. Each push builds an image and `uses: deploy`
# rolls that digest out. Do not copy the tag into envs/dev/stack.yaml.
# Production is a separate workspace: drop this deploy step there and
# promote by committing $MIABI_IMAGE_DIGEST into envs/prod/stack.yaml.
#
# Keep `run` as a quoted one-liner. Folded YAML (`>`) plus a line that ends
# in `>` redirects the rest of the script to /dev/null, so composer never
# sees composer.json even though the runner checked the repo out.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: laravel-example
on:
  push:
    branches: [main]
  manual: true
env:
  APP_ENV: testing
steps:
  - name: test-php
    image: php:8.4-cli
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    run: "apt-get update -qq && apt-get install -y -qq git unzip libpq-dev libsqlite3-dev >/dev/null && docker-php-ext-install pdo_pgsql pdo_sqlite >/dev/null && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && composer install --no-interaction --prefer-dist && php artisan test"

  - name: test-frontend
    image: node:22
    env:
      CI: "true"
    run: "npm ci && npm run build"

  - name: build
    uses: build
    dockerfile: Dockerfile
    cache: true

  - name: deploy
    uses: deploy
