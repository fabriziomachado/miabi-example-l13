# Dev desired state for miabi-example-l13.
#
# Two different jobs, as in the Miabi docs (Pipelines, Deploy on Push, GitOps):
#   • This file is the stack: database, route, env, resources.
#   • .miabi/pipeline.yaml is the image. `uses: deploy` rolls out each push
#     by digest. Do not write that tag or digest here — a git app is described
#     by its source, and the generated tag (run-<n>) is not a manifest field.
#   • .miabi/envs/prod is the promotion file. Pin $MIABI_IMAGE_DIGEST there,
#     in another workspace. Syncing both folders here would collide on names.
#
# Point a GitSource at this folder (.miabi/envs/dev), ref main. Automatic,
# prune and self-heal are the intended policy: Git is the desired state.
# Secrets are names in the vault, not values. Create them once in
# Sources → Secrets (laravel-app-key, minio-root-password). A missing
# name fails the sync instead of writing a placeholder.
# The zone miabi.unesc.net is already verified; it is not declared here.
apiVersion: miabi.io/v1
kind: Database
metadata: { name: laravel-db }
spec:
  engine: postgres
  version: "16-alpine"
  # Reuse the Postgres already running in the workspace when one is compatible.
  instance: auto
---
apiVersion: miabi.io/v1
kind: Application
metadata: { name: laravel-example }
spec:
  # Build from Git. The pipeline deploys the image; this block does not pin it.
  source:
    git: https://github.com/fabriziomachado/miabi-example-l13.git
    ref: main
    buildMethod: dockerfile
  ports:
    - container: 8080
      scheme: http
  deployment:
    # Two Swarm tasks, free to land on either node. Postgres is reached by
    # name on the overlay network, so the database does not pin a task.
    # There is no shared volume: session, cache and queue live in Postgres,
    # and files use the s3 disk against the MinIO already running in this
    # workspace (alias below). A node-local volume would pin every task.
    runtime: service
    replicas: 2
    strategy: rolling
    update:
      parallelism: 1
      delaySeconds: 10
  placement:
    constraints: []
  # Probe Laravel itself (/up), not only the web server. Start period covers
  # AUTORUN migrate + optimize before the first check must pass.
  healthcheck:
    type: http
    path: /up
    port: 8080
    intervalSeconds: 30
    timeoutSeconds: 5
    retries: 3
    startPeriodSeconds: 90
  env:
    APP_NAME: Laravel
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: "{{ .secrets.laravel-app-key }}"
    APP_URL: "https://laravel-example.miabi.unesc.net"
    ASSET_URL: "https://laravel-example.miabi.unesc.net"

    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    PHP_OPCACHE_ENABLE: "1"

    DB_CONNECTION: pgsql
    DB_HOST: "{{ .databases.laravel-db.host }}"
    DB_PORT: "{{ .databases.laravel-db.port }}"
    DB_DATABASE: "{{ .databases.laravel-db.name }}"
    DB_USERNAME: "{{ .databases.laravel-db.user }}"
    DB_PASSWORD: "{{ .databases.laravel-db.password }}"
    DB_SSLMODE: disable

    # Default disk is s3 so both replicas see the same files. The bucket
    # `laravel` lives on the workspace MinIO. The password is the vault
    # secret minio-root-password — the same value minio-1 uses as root.
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: "{{ .secrets.minio-root-password }}"
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: laravel
    AWS_ENDPOINT: http://mb-app-u3fltfmh-18:9000
    AWS_URL: http://mb-app-u3fltfmh-18:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

    # serversideup/php FrankenPHP — TLS ends at Miabi, not inside the container.
    SSL_MODE: "off"
    HEALTHCHECK_PATH: /up
    CADDY_SERVER_ROOT: /var/www/html/public

    AUTORUN_ENABLED: "true"
    AUTORUN_LARAVEL_STORAGE_LINK: "true"
    AUTORUN_LARAVEL_MIGRATION: "true"
    AUTORUN_LARAVEL_MIGRATION_FORCE: "true"
    AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    AUTORUN_LARAVEL_OPTIMIZE: "true"
  secretEnv:
    - APP_KEY
    - DB_PASSWORD
    - AWS_SECRET_ACCESS_KEY
  resources:
    memory: 512Mi
    cpu: "0.5"
---
# The zone miabi.unesc.net is already registered and verified in the panel
# (wildcard, TLS automatic). It is not declared here so GitOps does not take
# ownership of that domain.
apiVersion: miabi.io/v1
kind: Route
metadata: { name: laravel-example }
spec:
  hosts: [laravel-example.miabi.unesc.net]
  app: laravel-example
  port: 8080
  path: /
  tls: acme
