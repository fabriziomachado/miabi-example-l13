# Pipeline-as-code for this Laravel 13 + React (Inertia) app.
# Miabi adopts this file when the application is created from Git.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: laravel-example
on:
  push:
    branches: [main]
  manual: true
env:
  APP_ENV: testing
steps:
  - name: test-php
    image: php:8.4-cli
    env:
      CI: "true"
    run: >
      apt-get update -qq && apt-get install -y -qq git unzip libpq-dev >
      /dev/null && docker-php-ext-install pdo_pgsql >/dev/null &&
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
      composer install --no-interaction --prefer-dist &&
      php artisan test

  - name: test-frontend
    image: node:22
    env:
      CI: "true"
    run: "npm ci && npm run build"

  - name: build
    uses: build
    dockerfile: Dockerfile
    cache: true

  - name: deploy
    uses: deploy
